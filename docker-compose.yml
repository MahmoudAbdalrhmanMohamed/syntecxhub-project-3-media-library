version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: prism-studio-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: prism_media_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prism-studio-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/prism_media_db
      CORS_ORIGIN: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:4000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prism-studio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NUXT_INTERNAL_API_SECRET: prism-internal-ssr-key
      NUXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      NUXT_PUBLIC_BACKEND_ORIGIN: http://localhost:4000

volumes:
  mongodb_data:
